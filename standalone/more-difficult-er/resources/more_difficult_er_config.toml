        { text_id = 1061471111, select_flag_id = 1061472100, assert_on_select_flag_id = 1061460000, confirmation_text_id = 1061471120, show_on_event_flag_id = 1061460001 },
        { text_id = 1061471112, select_flag_id = 1061472101, assert_on_select_flag_id = 1061460001, confirmation_text_id = 1061471121, show_on_event_flag_id = 1061460002 },
